<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Icon Cloud</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #0f0f0f;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .icon-cloud {
      position: relative;
      width: 500px;
      height: 500px;
      perspective: 1000px;
    }
    .icon {
      position: absolute;
      width: 40px;
      height: 40px;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }
    .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 2px white);
    }
  </style>
</head>
<body>
  <div class="icon-cloud" id="iconCloud"></div>

  <script>
    const slugs = [
      "typescript","react", "flutter",
      "mongodb", "html5", "css3","javascript", "nodedotjs", "express", "flask",
      "fastapi","postgresql", "firebase", "postman", "vercel", "amazonwebservices", "mysql", "docker", "git", "jira",
      "github", "gitlab","numpy","pandas", 
      "cplusplus", "figma","amazonec2","streamlit"
    ];

    const cloud = document.getElementById("iconCloud");
    const radius = 180;
    const icons = [];

    slugs.forEach((slug, i) => {
      const icon = document.createElement("div");
      icon.className = "icon";
      icon.innerHTML = `<img src="https://cdn.simpleicons.org/${slug}/FFFFFF" alt="${slug}">`;

      const phi = Math.acos(-1 + (2 * i) / slugs.length);
      const theta = Math.sqrt(slugs.length * Math.PI) * phi;

      const x = radius * Math.cos(theta) * Math.sin(phi);
      const y = radius * Math.sin(theta) * Math.sin(phi);
      const z = radius * Math.cos(phi);

      icon.dataset.x = x;
      icon.dataset.y = y;
      icon.dataset.z = z;

      cloud.appendChild(icon);
      icons.push(icon);
    });

    let mouseX = 0;
    let mouseY = 0;
    let rotationX = 0;
    let rotationY = 0;

    // Capture mouse movement
    document.addEventListener("mousemove", (e) => {
      const rect = cloud.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      mouseX = (e.clientX - centerX) / 200;
      mouseY = (e.clientY - centerY) / 200;
    });

    function rotate() {
      rotationY += mouseX * 0.05;
      rotationX += mouseY * 0.05;

      const sinX = Math.sin(rotationX);
      const cosX = Math.cos(rotationX);
      const sinY = Math.sin(rotationY);
      const cosY = Math.cos(rotationY);

      icons.forEach(icon => {
        let x = parseFloat(icon.dataset.x);
        let y = parseFloat(icon.dataset.y);
        let z = parseFloat(icon.dataset.z);

        // Rotate Y axis
        let x1 = x * cosY - z * sinY;
        let z1 = z * cosY + x * sinY;

        // Rotate X axis
        let y1 = y * cosX - z1 * sinX;
        let z2 = z1 * cosX + y * sinX;

        const scale = 0.6 + (z2 + radius) / (2 * radius);
        const left = x1 + cloud.offsetWidth / 2 - 20;
        const top = y1 + cloud.offsetHeight / 2 - 20;

        icon.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
        icon.style.zIndex = Math.floor(scale * 100);
        icon.style.opacity = scale;
      });

      requestAnimationFrame(rotate);
    }

    rotate();
  </script>
</body>
</html>
